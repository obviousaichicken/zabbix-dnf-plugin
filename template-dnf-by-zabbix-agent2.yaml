          preprocessing:
            - type: JAVASCRIPT
              parameters:
                - |
                  var data = JSON.parse(value);
                  if (!data.classification || data.classification.complete !== true) {
                    throw 'Advisory classification is incomplete';
                  }
                  return data.summary.update_types.enhancement;
          master_item:
            key: dnf.get
          tags:
            - tag: component
              value: updates
        - uuid: 2a68cb941b9246d0b2d359bc7fd09437
          name: 'DNF: Updates pending other'
          type: DEPENDENT
          key: dnf.updates.other
          value_type: UNSIGNED
          description: 'Number of available package updates with no supported advisory category. This can include missing or unrecognized advisory metadata and does not necessarily mean non-security updates.'
          preprocessing:
            - type: JAVASCRIPT
              parameters:
                - |
                  var data = JSON.parse(value);
                  if (!data.classification || data.classification.complete !== true) {
                    throw 'Advisory classification is incomplete';
                  }
                  return data.summary.update_types.other;
          master_item:
            key: dnf.get
          tags:
            - tag: component
              value: updates
        - uuid: ee58f88d08984b94b80f18d9a959a582
          name: 'DNF: Last update result'
          type: DEPENDENT
          key: dnf.last_update.result
          value_type: UNSIGNED
          history: 7d
          trends: '0'
          description: 'Result of the most recent completed DNF transaction that upgraded a package: 0 means not recorded, 1 means success, and 2 means failed.'
          valuemap:
            name: 'DNF: Update result'
          preprocessing:
            - type: JAVASCRIPT
              parameters:
                - |
                  var data = JSON.parse(value);
                  var results = {
                    not_recorded: 0,
                    success: 1,
                    failed: 2
                  };
                  var result = data.summary.last_update.result;

                  if (!Object.prototype.hasOwnProperty.call(results, result)) {
                    throw 'Unsupported last update result: ' + result;
                  }

                  return results[result];
          master_item:
            key: dnf.get
          tags:
            - tag: component
              value: updates
          triggers:
            - uuid: 7f3a7d894529462eac162af169587d58
              expression: 'last(/DNF by Zabbix agent 2 active/dnf.last_update.result)=2'
              name: 'DNF: Last package update failed'
              opdata: 'Last update result: {ITEM.LASTVALUE1}'
              priority: WARNING
              description: 'The most recent package update transaction did not complete successfully.'
              tags:
                - tag: component
                  value: updates
                - tag: scope
                  value: update_history
        - uuid: b086e2d62446445cb05ce7d2b27d1606
          name: 'DNF: Last update time'
          type: DEPENDENT
          key: dnf.last_update.timestamp
          value_type: UNSIGNED
          units: unixtime
          trends: '0'
          description: 'Unix timestamp of the most recent completed DNF transaction that upgraded a package. No value is stored when no such transaction exists.'
          preprocessing:
            - type: JAVASCRIPT
              parameters:
                - |
                  var data = JSON.parse(value);
                  if (data.summary.last_update.timestamp === null) {
                    return null;
                  }

                  var timestamp = Date.parse(data.summary.last_update.timestamp);
                  if (isNaN(timestamp)) {
                    throw 'Invalid last update timestamp';
                  }

                  return Math.floor(timestamp / 1000);
          master_item:
            key: dnf.get
          tags:
            - tag: component
              value: updates
      discovery_rules:
        - uuid: e399ab0fcd1f40acbce6ffde8c994bdd
          name: 'DNF: Repository discovery'
          type: DEPENDENT
          key: dnf.repository
          delay: '0'
          lifetime_type: DELETE_AFTER
          lifetime: 30d
          enabled_lifetime_type: DISABLE_IMMEDIATELY
          enabled_lifetime: '0'
          description: 'Discovers enabled DNF repositories. Items for repositories that disappear are disabled immediately and retained for 30 days before deletion.'
          item_prototypes:
            - uuid: ce44985303844243a7a91d6c04320191
              name: 'DNF: Repository [{#REPO_NAME}]: Available update count'
              type: DEPENDENT
              key: 'dnf.repository.updates["{#REPO_ID}"]'
              delay: '0'
              value_type: UNSIGNED
              description: 'Number of available package updates from repository {#REPO_NAME} ({#REPO_ID}).'
              preprocessing:
                - type: JSONPATH
                  parameters:
                    - '$.repositories[?(@.id == "{#REPO_ID}")].update_count.first()'
              master_item:
                key: dnf.get
              tags:
                - tag: component
                  value: updates
                - tag: repository
                  value: '{#REPO_ID}'
                - tag: repository_name
                  value: '{#REPO_NAME}'
            - uuid: 6bd0f599fe084ee698b71920ffa839f9
              name: 'DNF: Repository [{#REPO_NAME}]: Pending package details'
              type: DEPENDENT
              key: 'dnf.repository.update.details["{#REPO_ID}"]'
              delay: '0'
              history: 1d
              value_type: TEXT
              trends: '0'
              description: 'Comma-separated NEVRA identifiers for packages with available updates from repository {#REPO_NAME} ({#REPO_ID}). The value is blank when there are no pending packages.'
              preprocessing:
                - type: JSONPATH
                  parameters:
                    - '$.updates[?(@.repository_id == "{#REPO_ID}")]'
                  error_handler: CUSTOM_VALUE
                  error_handler_params: '[]'
                - type: JAVASCRIPT
                  parameters:
                    - |
                      var updates = JSON.parse(value);
                      var packages = [];

                      for (var i = 0; i < updates.length; i++) {
                        var update = updates[i];
                        var epoch = update.epoch && update.epoch !== '(none)'
                          ? update.epoch + ':'
                          : '';
                        var nevra = update.name + '-' + epoch + update.version
                          + '-' + update.release + '.' + update.arch;

                        if (packages.indexOf(nevra) === -1) {
                          packages.push(nevra);
                        }
                      }

                      return packages.join(', ');
              master_item:
                key: dnf.get
              tags:
                - tag: component
                  value: updates
                - tag: repository
                  value: '{#REPO_ID}'
                - tag: repository_name
                  value: '{#REPO_NAME}'
          master_item:
            key: dnf.get
          preprocessing:
            - type: JSONPATH
              parameters:
                - $.repositories
          lld_macro_paths:
            - lld_macro: '{#REPO_ID}'
              path: $.id
            - lld_macro: '{#REPO_NAME}'
              path: $.name
      macros:
        - macro: '{$DNF.COLLECTION.DURATION.MAX}'
          value: '20'
          description: 'Maximum acceptable average collection duration, in seconds.'
        - macro: '{$DNF.COLLECTION.DURATION.WINDOW}'
          value: 30m
          description: 'Evaluation window for the average collection duration.'
        - macro: '{$DNF.NODATA.TIME}'
          value: 30m
          description: 'Time without a successful collection before an availability problem is raised.'
        - macro: '{$DNF.SECURITY.MIN}'
          value: '1'
          description: 'Minimum number of security updates that raises a problem.'
        - macro: '{$DNF.UPDATE.INTERVAL}'
          value: 15m
          description: 'Interval between complete DNF collections.'
      valuemaps:
        - uuid: 6cb3af8e0972445d8497cc80a05cdc71
          name: 'DNF: No/Yes'
          mappings:
            - value: '0'
              newvalue: 'No'
            - value: '1'
              newvalue: 'Yes'
        - uuid: a1f497099b3f4177aa8b0b7a6a91a077
          name: 'DNF: Update result'
          mappings:
            - value: '0'
              newvalue: 'Not recorded'
            - value: '1'
              newvalue: 'Success'
            - value: '2'
              newvalue: 'Failed'
