        - uuid: e1bc62499b3843ebba53e28799f2a605
          name: 'APT: Last update result'
          type: DEPENDENT
          key: apt.last_update.result
          value_type: UNSIGNED
          history: 7d
          trends: '0'
          description: 'Best-effort result from retained APT history for the most recent completed package upgrade: 0 means not recorded, 1 means success, and 2 means failed.'
          valuemap:
            name: 'APT: Update result'
          preprocessing:
            - type: JAVASCRIPT
              parameters:
                - |
                  var data = JSON.parse(value);
                  var results = {
                    not_recorded: 0,
                    success: 1,
                    failed: 2
                  };
                  var result = data.summary.last_update.result;

                  if (!Object.prototype.hasOwnProperty.call(results, result)) {
                    throw 'Unsupported last update result: ' + result;
                  }

                  return results[result];
          master_item:
            key: packages.get
          tags:
            - tag: component
              value: updates
        - uuid: 91698bd14718458bbb53f93dab9ac954
          name: 'APT: Last update time'
          type: DEPENDENT
          key: apt.last_update.timestamp
          value_type: UNSIGNED
          units: unixtime
          trends: '0'
          description: 'Best-effort Unix timestamp from retained APT history for the most recent completed package upgrade. No value is stored when no such transaction is recorded.'
          preprocessing:
            - type: JAVASCRIPT
              parameters:
                - |
                  var data = JSON.parse(value);
                  if (data.summary.last_update.timestamp === null) {
                    return null;
                  }

                  var timestamp = Date.parse(data.summary.last_update.timestamp);
                  if (isNaN(timestamp)) {
                    throw 'Invalid last update timestamp';
                  }

                  return Math.floor(timestamp / 1000);
          master_item:
            key: packages.get
          tags:
            - tag: component
              value: updates
