              name: 'APT: Package metadata is stale'
              opdata: 'Oldest package index age: {ITEM.LASTVALUE1}'
              priority: WARNING
              description: 'The cached APT package indexes are older than the configured threshold. The plugin does not refresh package metadata.'
              tags:
                - tag: component
                  value: metadata
                - tag: scope
                  value: availability
      discovery_rules:
        - uuid: 54ed4cf49cbe40d5a3f8cd57bc2c2625
          name: 'APT: Repository discovery'
          type: DEPENDENT
          key: apt.repository
          delay: '0'
          lifetime_type: DELETE_AFTER
          lifetime: 30d
          enabled_lifetime_type: DISABLE_IMMEDIATELY
          enabled_lifetime: '0'
          description: 'Discovers configured APT binary repositories represented by local indexes. Items for repositories that disappear are disabled immediately and retained for 30 days before deletion.'
          item_prototypes:
            - uuid: 3affad6f9e244973a061a5dd58a6db1b
              name: 'APT: Repository [{#REPO_NAME}]: Available update count'
              type: DEPENDENT
              key: 'apt.repository.updates["{#REPO_ID}"]'
              delay: '0'
              value_type: UNSIGNED
              description: 'Number of available package updates from repository {#REPO_NAME} ({#REPO_ID}).'
              preprocessing:
                - type: JSONPATH
                  parameters:
                    - '$.repositories[?(@.id == "{#REPO_ID}")].update_count.first()'
              master_item:
                key: packages.get
              tags:
                - tag: component
                  value: updates
                - tag: repository
                  value: '{#REPO_ID}'
                - tag: repository_name
                  value: '{#REPO_NAME}'
            - uuid: 1f1642799e724620b5d7f72aa02cce61
              name: 'APT: Repository [{#REPO_NAME}]: Pending package details'
              type: DEPENDENT
              key: 'apt.repository.update.details["{#REPO_ID}"]'
              delay: '0'
              history: 1d
              value_type: TEXT
              trends: '0'
              description: 'Comma-separated Debian package identifiers (name:architecture=full-version) for updates from repository {#REPO_NAME} ({#REPO_ID}). The value is blank when there are no pending packages.'
              preprocessing:
                - type: JSONPATH
                  parameters:
                    - '$.updates[?(@.repository_id == "{#REPO_ID}")]'
                  error_handler: CUSTOM_VALUE
                  error_handler_params: '[]'
                - type: JAVASCRIPT
                  parameters:
                    - |
                      var updates = JSON.parse(value);
                      var packages = [];

                      for (var i = 0; i < updates.length; i++) {
                        var identifier = updates[i].identifier;
                        if (typeof identifier !== 'string' || identifier.length === 0) {
                          throw 'APT update is missing its package identifier';
                        }

                        if (packages.indexOf(identifier) === -1) {
                          packages.push(identifier);
                        }
                      }

                      return packages.join(', ');
              master_item:
                key: packages.get
              tags:
                - tag: component
                  value: updates
                - tag: repository
                  value: '{#REPO_ID}'
                - tag: repository_name
                  value: '{#REPO_NAME}'
          master_item:
            key: packages.get
          preprocessing:
            - type: JSONPATH
              parameters:
                - $.repositories
          lld_macro_paths:
            - lld_macro: '{#REPO_ID}'
              path: $.id
            - lld_macro: '{#REPO_NAME}'
              path: $.name
      macros:
        - macro: '{$APT.COLLECTION.DURATION.MAX}'
          value: '20'
          description: 'Maximum acceptable average collection duration, in seconds.'
        - macro: '{$APT.METADATA.AGE.MAX}'
          value: 2d
          description: 'Maximum acceptable age of the oldest local APT binary index.'
        - macro: '{$APT.NODATA.TIME}'
          value: 30m
          description: 'Time without a successful collection before an availability problem is raised.'
        - macro: '{$APT.SECURITY.MIN}'
          value: '1'
          description: 'Minimum number of security updates that raises a problem.'
        - macro: '{$APT.UPDATE.INTERVAL}'
          value: 15m
          description: 'Interval between complete APT collections.'
      valuemaps:
        - uuid: 1ad4ae6d15764810a64664a30fa5b3af
          name: 'APT: No/Yes'
          mappings:
            - value: '0'
