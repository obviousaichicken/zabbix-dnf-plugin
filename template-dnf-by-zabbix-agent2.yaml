        - uuid: 6307a68026e44b628840bfc5265b43b3
          name: 'DNF: Reboot pending'
          type: DEPENDENT
          key: dnf.reboot.pending
          value_type: UNSIGNED
          description: 'Indicates whether installed reboot-sensitive packages or a newer installed kernel require the host to be rebooted.'
          valuemap:
