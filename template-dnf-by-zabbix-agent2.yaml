          triggers:
            - uuid: d1495d7325394f338fcb47a13061ab66
              expression: 'last(/DNF by Zabbix agent 2/dnf.reboot.pending)=1'
              name: 'DNF: Reboot is required'
              opdata: 'Reboot pending: {ITEM.LASTVALUE1}'
              priority: WARNING
              description: 'A reboot is required to complete package updates.'
              tags:
                - tag: component
