                - tag: scope
                  value: availability
        - uuid: 2035c55dfa8e4149bd267bade00d0119
          name: 'DNF: Advisory collection duration'
          type: DEPENDENT
          key: dnf.advisory.collection.duration
          value_type: FLOAT
