zabbix_export:
  version: '7.0'
  template_groups:
    - uuid: 846977d1dfed4968bc5f8bdb363285bc
      name: 'Templates/Operating systems'
  templates:
    - uuid: cd1513ce75e54662a2dbe3d676c4e6aa
      template: 'DNF by Zabbix agent 2'
      name: 'DNF by Zabbix agent 2'
      description: |
        Monitors enabled DNF repositories, available package updates, advisory categories, reboot status, and package update history through the Zabbix DNF Plugin for Agent 2.

        The plugin intentionally fails the master item rather than publishing partial data when repository or advisory classification queries fail. The "other" update category includes packages with missing or unrecognized advisory metadata and does not necessarily mean non-security updates.
      groups:
        - name: 'Templates/Operating systems'
      items:
        - uuid: 361f3f08c10e4ce9aef5d78b98c0492a
          name: 'DNF: Get update data'
          type: ZABBIX_PASSIVE
          key: dnf.get
          delay: '{$DNF.UPDATE.INTERVAL}'
          history: '0'
          value_type: TEXT
          trends: '0'
          description: 'Collects the complete package, repository, advisory, reboot, and update-history payload. The raw JSON is not retained because dependent items extract the monitored values.'
          timeout: 30s
          tags:
            - tag: component
              value: raw
            - tag: component
              value: updates
        - uuid: 08f65d52266a4db8acd8067fa07ffb4c
          name: 'DNF: Get advisory data'
          type: ZABBIX_PASSIVE
          key: dnf.advisories.get
          delay: '{$DNF.ADVISORY.UPDATE.INTERVAL}'
          history: '0'
          value_type: TEXT
          trends: '0'
          description: 'Collects applicable DNF security advisories independently from package-update monitoring. DNF4 intentionally returns compact relationship data, while DNF5 can return complete titles, CVEs, and issue dates.'
          timeout: 30s
          tags:
            - tag: component
              value: raw
            - tag: component
              value: security
        - uuid: 71e2e9c290414e79b76e0a151d1631ca
          name: 'DNF: Advisory discovery data'
          type: DEPENDENT
          key: dnf.advisory.discovery.data
          history: '0'
          value_type: TEXT
          trends: '0'
          description: 'Validates the complete advisory payload and severity-selection macros, then projects the compact records shared by advisory discovery and its dependent item prototypes. The default macro values produce an empty array. Invalid or incomplete input makes this item unsupported instead of falsely marking discovered advisories absent.'
          preprocessing:
            - type: JAVASCRIPT
              parameters:
                - |
                  var data = JSON.parse(value);
                  var selections = {
                    critical: '{$DNF.ADVISORY.LLD.CRITICAL}',
                    important: '{$DNF.ADVISORY.LLD.IMPORTANT}',
                    moderate: '{$DNF.ADVISORY.LLD.MODERATE}',
                    low: '{$DNF.ADVISORY.LLD.LOW}',
                    unknown: '{$DNF.ADVISORY.LLD.UNKNOWN}'
                  };

                  for (var selectedSeverity in selections) {
                    if (Object.prototype.hasOwnProperty.call(selections, selectedSeverity) &&
                        selections[selectedSeverity] !== '0' && selections[selectedSeverity] !== '1') {
                      throw 'Advisory discovery macro for ' + selectedSeverity + ' must be exactly 0 or 1';
                    }
                  }

                  if (!data || typeof data !== 'object' || Array.isArray(data) || data.schema_version !== 1) {
                    throw 'Advisory discovery requires schema version 1';
                  }
                  if (!data.collection || data.collection.complete !== true) {
                    throw 'Advisory discovery requires a complete collection';
                  }
                  if (!data.metadata || data.metadata.details_complete !== true ||
                      data.metadata.cves_complete !== true || data.metadata.issue_dates_complete !== true) {
                    throw 'Advisory discovery requires complete detail, CVE, and issue-date metadata';
                  }
                  if (!Array.isArray(data.advisories) || !data.summary ||
                      data.summary.advisories !== data.advisories.length) {
                    throw 'Advisory discovery payload count is inconsistent';
                  }

                  function safeIdentifier(id) {
                    if (typeof id !== 'string' || id.length === 0) {
                      throw 'Advisory discovery record has an invalid ID';
                    }
                    if (id.length > 256) {
                      throw 'Advisory discovery ID exceeds 256 UTF-16 code units';
                    }

                    var encoded = 'a';
                    for (var character = 0; character < id.length; character++) {
                      var hex = id.charCodeAt(character).toString(16);
                      while (hex.length < 4) {
                        hex = '0' + hex;
                      }
                      encoded += hex;
                    }
                    return encoded;
                  }

                  function sortedStringArray(values, field, id) {
                    if (!Array.isArray(values)) {
                      throw 'Advisory ' + id + ' has an invalid ' + field + ' array';
                    }

                    var result = [];
                    var seen = {};
                    for (var index = 0; index < values.length; index++) {
                      if (typeof values[index] !== 'string') {
                        throw 'Advisory ' + id + ' has a non-string ' + field + ' value';
                      }
                      var seenKey = '$' + values[index];
                      if (!Object.prototype.hasOwnProperty.call(seen, seenKey)) {
                        seen[seenKey] = true;
                        result.push(values[index]);
                      }
                    }
                    result.sort();
                    return result;
                  }

                  var records = [];
                  var seenIDs = {};
                  var seenSafeIDs = {};
                  for (var advisoryIndex = 0; advisoryIndex < data.advisories.length; advisoryIndex++) {
                    var advisory = data.advisories[advisoryIndex];
                    if (!advisory || typeof advisory !== 'object' || Array.isArray(advisory)) {
                      throw 'Advisory discovery record is not an object';
                    }

                    var id = advisory.id;
                    var safeID = safeIdentifier(id);
                    var seenIDKey = '$' + id;
                    if (Object.prototype.hasOwnProperty.call(seenIDs, seenIDKey) ||
                        Object.prototype.hasOwnProperty.call(seenSafeIDs, safeID)) {
                      throw 'Advisory discovery record has a duplicate ID';
                    }
                    seenIDs[seenIDKey] = true;
                    seenSafeIDs[safeID] = true;

                    var severity = advisory.severity;
                    if (!Object.prototype.hasOwnProperty.call(selections, severity)) {
                      throw 'Advisory ' + id + ' has an invalid severity';
                    }
                    if (advisory.type !== 'security') {
                      throw 'Advisory ' + id + ' is not a security advisory';
                    }
                    if (typeof advisory.title !== 'string' || advisory.title.length === 0) {
                      throw 'Advisory ' + id + ' has an invalid title';
                    }
                    if (typeof advisory.issued_at !== 'string') {
                      throw 'Advisory ' + id + ' has no complete issue timestamp';
                    }

                    var vendorTimestamp = Date.parse(advisory.issued_at);
                    if (isNaN(vendorTimestamp) || vendorTimestamp < 0) {
                      throw 'Advisory ' + id + ' has an invalid issue timestamp';
                    }
                    vendorTimestamp = Math.floor(vendorTimestamp / 1000);

                    var packages = sortedStringArray(
                      advisory.affected_update_nevras,
                      'affected package',
                      id
                    );
                    var cves = sortedStringArray(advisory.cve_ids, 'CVE', id);

                    if (selections[severity] === '1') {
                      records.push({
                        safe_id: safeID,
                        id: id,
                        severity: severity,
                        title: advisory.title,
                        presence: 1,
                        vendor_timestamp: vendorTimestamp,
                        affected_package_count: packages.length,
                        affected_packages: JSON.stringify(packages),
                        cves: JSON.stringify(cves)
                      });
                    }
                  }

                  records.sort(function (left, right) {
                    if (left.safe_id < right.safe_id) {
                      return -1;
                    }
                    if (left.safe_id > right.safe_id) {
                      return 1;
                    }
                    return 0;
                  });
                  return JSON.stringify(records);
          master_item:
            key: dnf.advisories.get
          tags:
            - tag: component
              value: security
        - uuid: ff3655362d88404ea8ef49b962176c03
          name: 'DNF: Advisory collection complete'
          type: DEPENDENT
          key: dnf.advisory.collection.complete
          value_type: UNSIGNED
          description: 'Indicates whether the independent advisory collection completed successfully. Command or parser failures make the master item unsupported and are detected by the no-data condition.'
          valuemap:
            name: 'DNF: No/Yes'
          preprocessing:
            - type: JSONPATH
              parameters:
                - $.collection.complete
            - type: BOOL_TO_DECIMAL
              parameters: []
          master_item:
            key: dnf.advisories.get
          tags:
            - tag: component
              value: security
          triggers:
            - uuid: 2188c13a58524751ab6c914b1eb9fe37
              expression: 'last(/DNF by Zabbix agent 2/dnf.advisory.collection.complete)=0 or nodata(/DNF by Zabbix agent 2/dnf.advisory.collection.complete,{$DNF.ADVISORY.NODATA.TIME})=1'
              name: 'DNF: Advisory collection is unavailable'
              opdata: 'Last advisory collection status: {ITEM.LASTVALUE1}'
              priority: HIGH
              description: 'DNF advisory data is stale or unavailable. Package-update monitoring remains independent.'
              tags:
                - tag: component
                  value: security
                - tag: scope
                  value: availability
        - uuid: 9f01cbb8803f44df9de9a79bb737b3bb
          name: 'DNF: Advisory collection duration'
          type: DEPENDENT
          key: dnf.advisory.collection.duration
          value_type: FLOAT
          units: s
          description: 'Time spent collecting the independent advisory payload, in seconds.'
          preprocessing:
            - type: JSONPATH
              parameters:
                - $.collection.duration_ms
            - type: MULTIPLIER
              parameters:
                - '0.001'
          master_item:
            key: dnf.advisories.get
          tags:
            - tag: component
              value: security
        - uuid: 881245196ffe43e69801400d8ff74e77
          name: 'DNF: Advisory details complete'
          type: DEPENDENT
          key: dnf.advisory.details.complete
          value_type: UNSIGNED
          description: 'Indicates whether titles and detail relationships are complete. This is normally false on DNF4 because its bounded strategy omits the bulk detail command.'
          valuemap:
            name: 'DNF: No/Yes'
          preprocessing:
            - type: JSONPATH
              parameters:
                - $.metadata.details_complete
            - type: BOOL_TO_DECIMAL
              parameters: []
          master_item:
            key: dnf.advisories.get
          tags:
            - tag: component
              value: security
          triggers:
            - uuid: 9994bfb13d214c92a19b34f0c8174311
              expression: 'last(/DNF by Zabbix agent 2/dnf.advisory.details.complete)=0 or last(/DNF by Zabbix agent 2/dnf.advisory.cves.complete)=0 or last(/DNF by Zabbix agent 2/dnf.advisory.issue_dates.complete)=0'
              name: 'DNF: Advisory metadata is incomplete'
              opdata: 'Details: {ITEM.LASTVALUE1}'
              priority: WARNING
              description: 'One or more advisory detail, CVE, or issue-date capabilities are incomplete. DNF4 reports this by design; known compact advisory and package relationships remain usable.'
              tags:
                - tag: component
                  value: security
                - tag: scope
                  value: notice
        - uuid: 1fc2be7824d143e4a6f3205374dca630
          name: 'DNF: Advisory CVEs complete'
          type: DEPENDENT
          key: dnf.advisory.cves.complete
          value_type: UNSIGNED
          description: 'Indicates whether the unique CVE count is authoritative. A false value means the reported CVEs are known data, not proof that other CVEs do not apply.'
          valuemap:
            name: 'DNF: No/Yes'
          preprocessing:
            - type: JSONPATH
              parameters:
                - $.metadata.cves_complete
            - type: BOOL_TO_DECIMAL
              parameters: []
          master_item:
            key: dnf.advisories.get
          tags:
            - tag: component
              value: security
        - uuid: 22f2c121abff4010b758c78dfd3a907e
          name: 'DNF: Advisory issue dates complete'
          type: DEPENDENT
          key: dnf.advisory.issue_dates.complete
          value_type: UNSIGNED
          description: 'Indicates whether true vendor issue dates are complete. DNF4 normally exposes only Updated timestamps when detail is available and therefore cannot claim this capability.'
          valuemap:
            name: 'DNF: No/Yes'
          preprocessing:
            - type: JSONPATH
              parameters:
                - $.metadata.issue_dates_complete
            - type: BOOL_TO_DECIMAL
              parameters: []
          master_item:
            key: dnf.advisories.get
          tags:
            - tag: component
              value: security
        - uuid: 5f64cd8649b94cc8ab8609e6fbb1623f
          name: 'DNF: Security advisories total'
          type: DEPENDENT
          key: dnf.advisory.total
          value_type: UNSIGNED
          description: 'Number of unique applicable security advisory IDs.'
          preprocessing:
            - type: JSONPATH
              parameters:
                - $.summary.advisories
          master_item:
            key: dnf.advisories.get
          tags:
            - tag: component
              value: security
        - uuid: e458e63e45014a60be4ae27d98ebc7d6
          name: 'DNF: Unique known CVEs'
          type: DEPENDENT
          key: dnf.advisory.cves
          value_type: UNSIGNED
          description: 'Number of unique known CVE IDs. This count is authoritative only when the advisory CVE completeness item is Yes.'
          preprocessing:
            - type: JSONPATH
              parameters:
                - $.summary.unique_cves
          master_item:
            key: dnf.advisories.get
          tags:
            - tag: component
              value: security
        - uuid: 547a5b36f7c8408c83e4dd8bf00d00e0
          name: 'DNF: Security advisories critical'
          type: DEPENDENT
          key: dnf.advisory.critical
          value_type: UNSIGNED
          description: 'Number of unique applicable Critical security advisories.'
          preprocessing:
            - type: JSONPATH
              parameters:
                - $.summary.advisories_by_severity.critical
          master_item:
            key: dnf.advisories.get
          tags:
            - tag: component
              value: security
          triggers:
            - uuid: e4749b89b65a4544ab2a894af864d6bf
              expression: 'last(/DNF by Zabbix agent 2/dnf.advisory.critical)>={$DNF.SECURITY.CRITICAL.MIN}'
              name: 'DNF: Critical security advisories are applicable'
              opdata: 'Critical advisories: {ITEM.LASTVALUE1}'
              priority: DISASTER
              description: 'One or more Critical DNF security advisories apply to pending package updates.'
              tags:
                - tag: component
                  value: security
                - tag: scope
                  value: security
        - uuid: c1c36bd5e1454b1f834d2a1e6ed161fc
          name: 'DNF: Security advisories important'
          type: DEPENDENT
          key: dnf.advisory.important
          value_type: UNSIGNED
          description: 'Number of unique applicable Important security advisories.'
          preprocessing:
            - type: JSONPATH
              parameters:
                - $.summary.advisories_by_severity.important
          master_item:
            key: dnf.advisories.get
          tags:
            - tag: component
              value: security
          triggers:
            - uuid: 09a754faea1843cda7d97aa69cc55770
              expression: 'last(/DNF by Zabbix agent 2/dnf.advisory.critical)<{$DNF.SECURITY.CRITICAL.MIN} and last(/DNF by Zabbix agent 2/dnf.advisory.important)>={$DNF.SECURITY.IMPORTANT.MIN}'
              name: 'DNF: Important security advisories are applicable'
              opdata: 'Important advisories: {ITEM.LASTVALUE1}'
              priority: HIGH
              description: 'Important DNF security advisories apply and the Critical threshold is not met, keeping the Critical and Important problems mutually exclusive.'
              tags:
                - tag: component
                  value: security
                - tag: scope
                  value: security
        - uuid: dbcad7e6d35a4018b85727fa752bda97
          name: 'DNF: Security advisories moderate'
          type: DEPENDENT
          key: dnf.advisory.moderate
          value_type: UNSIGNED
          description: 'Number of unique applicable Moderate security advisories.'
          preprocessing:
            - type: JSONPATH
              parameters:
                - $.summary.advisories_by_severity.moderate
          master_item:
            key: dnf.advisories.get
          tags:
            - tag: component
              value: security
        - uuid: 4c322f2a70704473b4c3070e8cff1e16
          name: 'DNF: Security advisories low'
          type: DEPENDENT
          key: dnf.advisory.low
          value_type: UNSIGNED
          description: 'Number of unique applicable Low security advisories.'
          preprocessing:
            - type: JSONPATH
              parameters:
                - $.summary.advisories_by_severity.low
          master_item:
            key: dnf.advisories.get
          tags:
            - tag: component
              value: security
        - uuid: 010da202032240afa814406cb7c0daaa
          name: 'DNF: Security advisories unknown severity'
          type: DEPENDENT
          key: dnf.advisory.unknown
          value_type: UNSIGNED
          description: 'Number of unique applicable advisories whose vendor severity is absent or unrecognized.'
          preprocessing:
            - type: JSONPATH
              parameters:
                - $.summary.advisories_by_severity.unknown
          master_item:
            key: dnf.advisories.get
          tags:
            - tag: component
              value: security
          triggers:
            - uuid: 1e77d1176b13464585ad9d2c21e7f11f
              expression: 'last(/DNF by Zabbix agent 2/dnf.advisory.unknown)>{$DNF.SECURITY.UNKNOWN.MAX} or last(/DNF by Zabbix agent 2/dnf.advisory.packages.unknown)>{$DNF.SECURITY.UNKNOWN.MAX}'
              name: 'DNF: Security advisory severity is unknown'
              opdata: 'Unknown advisories: {ITEM.LASTVALUE1}'
              priority: HIGH
              description: 'The number of advisories or affected package updates with Unknown severity exceeds the configured maximum.'
              tags:
                - tag: component
                  value: security
                - tag: scope
                  value: security
        - uuid: 24b24256d3c84495809a079c8a2f5a15
          name: 'DNF: Affected package updates critical'
          type: DEPENDENT
          key: dnf.advisory.packages.critical
          value_type: UNSIGNED
          description: 'Number of unique pending package updates whose highest linked advisory severity is Critical.'
          preprocessing:
            - type: JSONPATH
              parameters:
                - $.summary.package_updates_by_severity.critical
          master_item:
            key: dnf.advisories.get
          tags:
            - tag: component
              value: security
          triggers:
            - uuid: 06e19598e8b34cfa828079f8ca1c88c6
              expression: 'last(/DNF by Zabbix agent 2/dnf.updates.security)>(last(/DNF by Zabbix agent 2/dnf.advisory.packages.critical)+last(/DNF by Zabbix agent 2/dnf.advisory.packages.important)+last(/DNF by Zabbix agent 2/dnf.advisory.packages.moderate)+last(/DNF by Zabbix agent 2/dnf.advisory.packages.low)+last(/DNF by Zabbix agent 2/dnf.advisory.packages.unknown))'
              name: 'DNF: Security package updates lack advisory objects'
              opdata: 'Security updates: {ITEM.LASTVALUE1}'
              priority: WARNING
              description: 'The package classifier reports more security updates than the advisory collector can link to advisory objects. Investigate metadata freshness or vendor relationship ambiguity.'
              tags:
                - tag: component
                  value: security
                - tag: scope
                  value: notice
        - uuid: 28dcb87fd35e40cfafb7be1ce732ee04
          name: 'DNF: Affected package updates important'
          type: DEPENDENT
          key: dnf.advisory.packages.important
          value_type: UNSIGNED
          description: 'Number of unique pending package updates whose highest linked advisory severity is Important.'
          preprocessing:
            - type: JSONPATH
              parameters:
                - $.summary.package_updates_by_severity.important
          master_item:
            key: dnf.advisories.get
          tags:
            - tag: component
              value: security
        - uuid: 933776b7bd734114a17f661b81e4e554
          name: 'DNF: Affected package updates moderate'
          type: DEPENDENT
          key: dnf.advisory.packages.moderate
          value_type: UNSIGNED
          description: 'Number of unique pending package updates whose highest linked advisory severity is Moderate.'
          preprocessing:
            - type: JSONPATH
              parameters:
                - $.summary.package_updates_by_severity.moderate
          master_item:
            key: dnf.advisories.get
          tags:
            - tag: component
              value: security
        - uuid: 4e35b3b4fd4f43b1a559f9a8905b33ec
          name: 'DNF: Affected package updates low'
          type: DEPENDENT
          key: dnf.advisory.packages.low
          value_type: UNSIGNED
          description: 'Number of unique pending package updates whose highest linked advisory severity is Low.'
          preprocessing:
            - type: JSONPATH
              parameters:
                - $.summary.package_updates_by_severity.low
          master_item:
            key: dnf.advisories.get
          tags:
            - tag: component
              value: security
        - uuid: a5c9ac80d7a147ac8388f332f288728d
          name: 'DNF: Affected package updates unknown severity'
          type: DEPENDENT
          key: dnf.advisory.packages.unknown
          value_type: UNSIGNED
          description: 'Number of unique pending package updates whose highest linked advisory severity is Unknown.'
          preprocessing:
            - type: JSONPATH
              parameters:
                - $.summary.package_updates_by_severity.unknown
          master_item:
            key: dnf.advisories.get
          tags:
            - tag: component
              value: security
        - uuid: 0f5e596fac284c43943dd23ba7fb9ac2
          name: 'DNF: Oldest advisory vendor timestamp'
          type: DEPENDENT
          key: dnf.advisory.oldest.timestamp
          value_type: UNSIGNED
          units: unixtime
          trends: '0'
          description: 'Unix timestamp of the oldest preferred vendor timestamp. Issue dates are preferred; Updated is used only when an issue date is unavailable. No value is stored when no vendor timestamp is known.'
          preprocessing:
            - type: JAVASCRIPT
              parameters:
                - |
                  var timestamp = JSON.parse(value).summary.oldest_vendor_timestamp;
                  if (timestamp === null) {
                    return null;
                  }

                  var milliseconds = Date.parse(timestamp);
                  if (isNaN(milliseconds)) {
                    throw 'Invalid oldest vendor timestamp';
                  }

                  return Math.floor(milliseconds / 1000);
          master_item:
            key: dnf.advisories.get
          tags:
            - tag: component
              value: security
        - uuid: 66112974eef648cb8a98360ed25b7752
          name: 'DNF: Oldest advisory vendor age'
          type: DEPENDENT
          key: dnf.advisory.oldest.age
          value_type: UNSIGNED
          units: s
          description: 'Age of the oldest preferred vendor timestamp in seconds. Future vendor timestamps are reported by the plugin as age zero.'
          preprocessing:
            - type: JAVASCRIPT
              parameters:
                - |
                  var age = JSON.parse(value).summary.oldest_vendor_age_seconds;
                  if (age === null) {
                    return null;
                  }
                  if (typeof age !== 'number' || age < 0 || !isFinite(age)) {
                    throw 'Invalid oldest vendor age';
                  }

                  return Math.floor(age);
          master_item:
            key: dnf.advisories.get
          tags:
            - tag: component
              value: security
          triggers:
            - uuid: fc9d20b0c3ed4eba8162c779147197fd
              expression: 'last(/DNF by Zabbix agent 2/dnf.advisory.oldest.age)>{$DNF.SECURITY.ADVISORY.MAX.AGE}'
              name: 'DNF: Applicable security advisory is old'
              opdata: 'Oldest vendor age: {ITEM.LASTVALUE1}'
              priority: WARNING
              description: 'The oldest known vendor timestamp for an applicable advisory exceeds the configured maximum age.'
              tags:
                - tag: component
                  value: security
                - tag: scope
                  value: security
        - uuid: 4d52f385fe314d188718520cd0aef613
          name: 'DNF: Oldest advisory timestamp basis'
          type: DEPENDENT
          key: dnf.advisory.oldest.basis
          value_type: CHAR
          trends: '0'
          description: 'Basis of the oldest vendor timestamp: issued, updated, or none.'
          preprocessing:
            - type: JSONPATH
              parameters:
                - $.summary.oldest_vendor_timestamp_basis
          master_item:
            key: dnf.advisories.get
          tags:
            - tag: component
              value: security
        - uuid: 3fd9d579bf414eb094f11f6ff9cb0e0a
          name: 'DNF: Collection complete'
          type: DEPENDENT
          key: dnf.collection.complete
          value_type: UNSIGNED
          description: 'Indicates whether the plugin completed every required DNF query. Failed collections make the master item unsupported and are also detected by the no-data condition.'
          valuemap:
            name: 'DNF: No/Yes'
          preprocessing:
            - type: JSONPATH
              parameters:
                - $.collection.complete
            - type: BOOL_TO_DECIMAL
              parameters: []
          master_item:
            key: dnf.get
          tags:
            - tag: component
              value: updates
          triggers:
            - uuid: 72eac0e05b1046798bef54e9fec9e9bb
              expression: 'last(/DNF by Zabbix agent 2/dnf.collection.complete)=0 or nodata(/DNF by Zabbix agent 2/dnf.collection.complete,{$DNF.NODATA.TIME})=1'
              name: 'DNF: Collection is unavailable'
              opdata: 'Last collection status: {ITEM.LASTVALUE1}'
              priority: HIGH
              description: 'DNF update data is stale or unavailable until collection succeeds.'
              tags:
                - tag: component
                  value: updates
                - tag: scope
                  value: availability
        - uuid: a5bd29e5713f43c3a340f31ac85d2541
          name: 'DNF: Collection duration'
          type: DEPENDENT
          key: dnf.collection.duration
          value_type: FLOAT
          units: s
          description: 'Time spent collecting the complete DNF payload, in seconds.'
          preprocessing:
            - type: JSONPATH
              parameters:
                - $.collection.duration_ms
            - type: MULTIPLIER
              parameters:
                - '0.001'
          master_item:
            key: dnf.get
          tags:
            - tag: component
              value: updates
          triggers:
            - uuid: b3ba6d2f74db4360b4ac3eda6e965a8f
              expression: 'avg(/DNF by Zabbix agent 2/dnf.collection.duration,{$DNF.COLLECTION.DURATION.WINDOW})>{$DNF.COLLECTION.DURATION.MAX}'
              name: 'DNF: Collection is slow'
              opdata: 'Collection duration: {ITEM.LASTVALUE1}'
              priority: WARNING
              description: 'The average collection duration is approaching the hard plugin and item timeout. Check repository availability and DNF performance.'
              tags:
                - tag: component
                  value: updates
                - tag: scope
                  value: performance
        - uuid: 8caac172573b41a8bd9bde476fd22250
          name: 'DNF: Advisory classification complete'
          type: DEPENDENT
          key: dnf.classification.complete
          value_type: UNSIGNED
          description: 'Indicates that all advisory categories were classified successfully. Strict classification failures make the master collection fail instead of publishing partial category counts.'
          valuemap:
            name: 'DNF: No/Yes'
          preprocessing:
            - type: JSONPATH
              parameters:
                - $.classification.complete
            - type: BOOL_TO_DECIMAL
              parameters: []
          master_item:
            key: dnf.get
          tags:
            - tag: component
              value: updates
        - uuid: e7b607ef89c241f3adf45e8542dccc87
          name: 'DNF: Updates pending total'
