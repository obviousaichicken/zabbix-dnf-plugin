          tags:
            - tag: component
              value: security
        - uuid: 2b52da7557d245958dde05f5cad7f854
          name: 'DNF: Oldest advisory vendor timestamp'
          type: DEPENDENT
          key: dnf.advisory.oldest.timestamp
          value_type: UNSIGNED
          units: unixtime
          trends: '0'
          description: 'Unix timestamp of the oldest preferred vendor timestamp. Issue dates are preferred; Updated is used only when an issue date is unavailable. No value is stored when no vendor timestamp is known.'
          preprocessing:
            - type: JAVASCRIPT
              parameters:
                - |
                  var timestamp = JSON.parse(value).summary.oldest_vendor_timestamp;
                  if (timestamp === null) {
                    return null;
                  }

                  var milliseconds = Date.parse(timestamp);
                  if (isNaN(milliseconds)) {
                    throw 'Invalid oldest vendor timestamp';
                  }

                  return Math.floor(milliseconds / 1000);
          master_item:
            key: dnf.advisories.get
          tags:
            - tag: component
              value: security
        - uuid: e22d4e02664c45ed804bb86a4d475ea5
          name: 'DNF: Oldest advisory vendor age'
          type: DEPENDENT
          key: dnf.advisory.oldest.age
          value_type: UNSIGNED
          units: s
          description: 'Age of the oldest preferred vendor timestamp in seconds. Future vendor timestamps are reported by the plugin as age zero.'
          preprocessing:
            - type: JAVASCRIPT
              parameters:
                - |
                  var age = JSON.parse(value).summary.oldest_vendor_age_seconds;
                  if (age === null) {
                    return null;
                  }
                  if (typeof age !== 'number' || age < 0 || !isFinite(age)) {
                    throw 'Invalid oldest vendor age';
                  }

                  return Math.floor(age);
          master_item:
            key: dnf.advisories.get
          tags:
            - tag: component
              value: security
          triggers:
            - uuid: 2058dd13f32c487fabec33e3df42396f
              expression: 'last(/DNF by Zabbix agent 2 active/dnf.advisory.oldest.age)>{$DNF.SECURITY.ADVISORY.MAX.AGE}'
              name: 'DNF: Applicable security advisory is old'
              opdata: 'Oldest vendor age: {ITEM.LASTVALUE1}'
              priority: WARNING
              description: 'The oldest known vendor timestamp for an applicable advisory exceeds the configured maximum age.'
              tags:
                - tag: component
                  value: security
                - tag: scope
                  value: security
        - uuid: 869e8678ab8f47dda05a51ecd26f6d74
          name: 'DNF: Oldest advisory timestamp basis'
          type: DEPENDENT
          key: dnf.advisory.oldest.basis
          value_type: CHAR
          trends: '0'
          description: 'Basis of the oldest vendor timestamp: issued, updated, or none.'
          preprocessing:
            - type: JSONPATH
              parameters:
                - $.summary.oldest_vendor_timestamp_basis
          master_item:
            key: dnf.advisories.get
          tags:
            - tag: component
              value: security
        - uuid: 1f91658bdd5f414e8f6f8c88867e8d5f
          name: 'DNF: Collection complete'
          type: DEPENDENT
          key: dnf.collection.complete
          value_type: UNSIGNED
          description: 'Indicates whether the plugin completed every required DNF query. Failed collections make the master item unsupported and are also detected by the no-data condition.'
          valuemap:
            name: 'DNF: No/Yes'
          preprocessing:
            - type: JSONPATH
              parameters:
                - $.collection.complete
            - type: BOOL_TO_DECIMAL
              parameters: []
          master_item:
            key: dnf.get
          tags:
            - tag: component
              value: updates
          triggers:
            - uuid: b0d4a6a741f947b2beb6a65e435a9465
              expression: 'last(/DNF by Zabbix agent 2 active/dnf.collection.complete)=0 or nodata(/DNF by Zabbix agent 2 active/dnf.collection.complete,{$DNF.NODATA.TIME})=1'
              name: 'DNF: Collection is unavailable'
              opdata: 'Last collection status: {ITEM.LASTVALUE1}'
              priority: HIGH
              description: 'DNF update data is stale or unavailable until collection succeeds.'
              tags:
                - tag: component
                  value: updates
                - tag: scope
                  value: availability
        - uuid: ac8526792ded4d1b801656787f4964bb
          name: 'DNF: Collection duration'
          type: DEPENDENT
          key: dnf.collection.duration
          value_type: FLOAT
          units: s
          description: 'Time spent collecting the complete DNF payload, in seconds.'
          preprocessing:
            - type: JSONPATH
              parameters:
                - $.collection.duration_ms
            - type: MULTIPLIER
              parameters:
                - '0.001'
          master_item:
            key: dnf.get
          tags:
            - tag: component
              value: updates
          triggers:
            - uuid: 21aa180342244d9e86b401625b674cd8
              expression: 'avg(/DNF by Zabbix agent 2 active/dnf.collection.duration,{$DNF.COLLECTION.DURATION.WINDOW})>{$DNF.COLLECTION.DURATION.MAX}'
              name: 'DNF: Collection is slow'
              opdata: 'Collection duration: {ITEM.LASTVALUE1}'
              priority: WARNING
              description: 'The average collection duration is approaching the hard plugin and item timeout. Check repository availability and DNF performance.'
              tags:
                - tag: component
                  value: updates
                - tag: scope
                  value: performance
        - uuid: 1f1767220bec49a1b8493cc529d70c2f
          name: 'DNF: Advisory classification complete'
          type: DEPENDENT
          key: dnf.classification.complete
          value_type: UNSIGNED
          description: 'Indicates that all advisory categories were classified successfully. Strict classification failures make the master collection fail instead of publishing partial category counts.'
          valuemap:
            name: 'DNF: No/Yes'
          preprocessing:
            - type: JSONPATH
              parameters:
                - $.classification.complete
            - type: BOOL_TO_DECIMAL
              parameters: []
          master_item:
            key: dnf.get
          tags:
            - tag: component
              value: updates
        - uuid: e4b332b3b8874802858e4a9db98aec29
          name: 'DNF: Updates pending total'
          type: DEPENDENT
          key: dnf.updates
          value_type: UNSIGNED
          description: 'Total number of available package updates across all enabled repositories.'
          preprocessing:
            - type: JSONPATH
              parameters:
                - $.summary.updates
          master_item:
            key: dnf.get
          tags:
            - tag: component
              value: updates
        - uuid: df35fac297f14252a4124bb0e2849022
          name: 'DNF: Enabled repositories'
          type: DEPENDENT
          key: dnf.repositories
          value_type: UNSIGNED
          description: 'Number of enabled DNF repositories included in the collection.'
          preprocessing:
            - type: JSONPATH
              parameters:
                - $.summary.repositories
          master_item:
            key: dnf.get
          tags:
            - tag: component
              value: updates
        - uuid: c8f48e54bdfa4fe1913bd81320ec04a3
          name: 'DNF: Updates pending'
          type: DEPENDENT
          key: dnf.updates.pending
          value_type: UNSIGNED
          description: 'Indicates whether one or more package updates are available.'
          valuemap:
            name: 'DNF: No/Yes'
          preprocessing:
            - type: JSONPATH
              parameters:
                - $.summary.updates_pending
            - type: BOOL_TO_DECIMAL
              parameters: []
          master_item:
            key: dnf.get
          tags:
            - tag: component
              value: updates
        - uuid: 3fa58ceafc284f35ad60d049941a53ab
          name: 'DNF: Reboot pending'
          type: DEPENDENT
          key: dnf.reboot.pending
          value_type: UNSIGNED
          description: 'Indicates whether installed reboot-sensitive packages or a newer installed kernel require the host to be rebooted.'
          valuemap:
            name: 'DNF: No/Yes'
          preprocessing:
            - type: JSONPATH
              parameters:
                - $.summary.reboot_pending
            - type: BOOL_TO_DECIMAL
              parameters: []
          master_item:
            key: dnf.get
          tags:
            - tag: component
              value: updates
          triggers:
            - uuid: 203008baa01b4be5bdb9c7bb77e10a2a
              expression: 'last(/DNF by Zabbix agent 2 active/dnf.reboot.pending)=1'
              name: 'DNF: Reboot is required'
              opdata: 'Reboot pending: {ITEM.LASTVALUE1}'
              priority: WARNING
              description: 'A reboot is required to complete package updates.'
              tags:
                - tag: component
                  value: updates
                - tag: scope
                  value: maintenance
        - uuid: 2c69a75cfcbb4e6cb944eb5f0cfd9bf8
          name: 'DNF: Updates pending security'
          type: DEPENDENT
          key: dnf.updates.security
          value_type: UNSIGNED
          description: 'Number of available package updates classified by repository advisory metadata as security updates.'
          preprocessing:
            - type: JAVASCRIPT
              parameters:
                - |
                  var data = JSON.parse(value);
                  if (!data.classification || data.classification.complete !== true) {
                    throw 'Advisory classification is incomplete';
                  }
                  return data.summary.update_types.security;
          master_item:
            key: dnf.get
          tags:
            - tag: component
              value: updates
          triggers:
            - uuid: 27d39e0011fb42d7b1b0e9b20fe1675d
              expression: 'last(/DNF by Zabbix agent 2 active/dnf.updates.security)>={$DNF.SECURITY.MIN}'
              name: 'DNF: Security updates are available'
              opdata: 'Security updates: {ITEM.LASTVALUE1}'
              priority: HIGH
              description: 'One or more security updates are available.'
              tags:
                - tag: component
                  value: updates
                - tag: scope
                  value: security
        - uuid: 21df4041e24d4a9fb1405ad813b4bae2
          name: 'DNF: Updates pending bugfix'
          type: DEPENDENT
          key: dnf.updates.bugfix
          value_type: UNSIGNED
          description: 'Number of available package updates classified by repository advisory metadata as bug fixes.'
          preprocessing:
            - type: JAVASCRIPT
              parameters:
                - |
                  var data = JSON.parse(value);
                  if (!data.classification || data.classification.complete !== true) {
                    throw 'Advisory classification is incomplete';
                  }
                  return data.summary.update_types.bugfix;
          master_item:
            key: dnf.get
          tags:
            - tag: component
              value: updates
        - uuid: bd826ee414af47e89627b7eeacd20f36
          name: 'DNF: Updates pending enhancement'
          type: DEPENDENT
          key: dnf.updates.enhancement
          value_type: UNSIGNED
          description: 'Number of available package updates classified by repository advisory metadata as enhancements.'
          preprocessing:
            - type: JAVASCRIPT
              parameters:
                - |
                  var data = JSON.parse(value);
                  if (!data.classification || data.classification.complete !== true) {
                    throw 'Advisory classification is incomplete';
                  }
                  return data.summary.update_types.enhancement;
          master_item:
            key: dnf.get
          tags:
            - tag: component
              value: updates
        - uuid: 2a68cb941b9246d0b2d359bc7fd09437
          name: 'DNF: Updates pending other'
          type: DEPENDENT
          key: dnf.updates.other
          value_type: UNSIGNED
          description: 'Number of available package updates with no supported advisory category. This can include missing or unrecognized advisory metadata and does not necessarily mean non-security updates.'
          preprocessing:
            - type: JAVASCRIPT
              parameters:
                - |
                  var data = JSON.parse(value);
                  if (!data.classification || data.classification.complete !== true) {
                    throw 'Advisory classification is incomplete';
                  }
                  return data.summary.update_types.other;
          master_item:
            key: dnf.get
          tags:
            - tag: component
              value: updates
        - uuid: ee58f88d08984b94b80f18d9a959a582
          name: 'DNF: Last update result'
          type: DEPENDENT
          key: dnf.last_update.result
          value_type: UNSIGNED
          history: 7d
          trends: '0'
          description: 'Result of the most recent completed DNF transaction that upgraded a package: 0 means not recorded, 1 means success, and 2 means failed.'
          valuemap:
            name: 'DNF: Update result'
          preprocessing:
            - type: JAVASCRIPT
              parameters:
                - |
                  var data = JSON.parse(value);
                  var results = {
                    not_recorded: 0,
                    success: 1,
                    failed: 2
                  };
                  var result = data.summary.last_update.result;

                  if (!Object.prototype.hasOwnProperty.call(results, result)) {
                    throw 'Unsupported last update result: ' + result;
                  }

                  return results[result];
          master_item:
            key: dnf.get
          tags:
            - tag: component
              value: updates
          triggers:
            - uuid: 7f3a7d894529462eac162af169587d58
              expression: 'last(/DNF by Zabbix agent 2 active/dnf.last_update.result)=2'
              name: 'DNF: Last package update failed'
              opdata: 'Last update result: {ITEM.LASTVALUE1}'
              priority: WARNING
              description: 'The most recent package update transaction did not complete successfully.'
              tags:
                - tag: component
                  value: updates
                - tag: scope
                  value: update_history
        - uuid: b086e2d62446445cb05ce7d2b27d1606
          name: 'DNF: Last update time'
          type: DEPENDENT
          key: dnf.last_update.timestamp
          value_type: UNSIGNED
          units: unixtime
          trends: '0'
          description: 'Unix timestamp of the most recent completed DNF transaction that upgraded a package. No value is stored when no such transaction exists.'
          preprocessing:
            - type: JAVASCRIPT
              parameters:
                - |
                  var data = JSON.parse(value);
                  if (data.summary.last_update.timestamp === null) {
                    return null;
                  }

                  var timestamp = Date.parse(data.summary.last_update.timestamp);
                  if (isNaN(timestamp)) {
                    throw 'Invalid last update timestamp';
                  }

                  return Math.floor(timestamp / 1000);
          master_item:
            key: dnf.get
          tags:
            - tag: component
              value: updates
      discovery_rules:
        - uuid: e399ab0fcd1f40acbce6ffde8c994bdd
          name: 'DNF: Repository discovery'
          type: DEPENDENT
          key: dnf.repository
          delay: '0'
          lifetime_type: DELETE_AFTER
          lifetime: 30d
          enabled_lifetime_type: DISABLE_IMMEDIATELY
          enabled_lifetime: '0'
          description: 'Discovers enabled DNF repositories. Items for repositories that disappear are disabled immediately and retained for 30 days before deletion.'
          item_prototypes:
            - uuid: ce44985303844243a7a91d6c04320191
              name: 'DNF: Repository [{#REPO_NAME}]: Available update count'
              type: DEPENDENT
              key: 'dnf.repository.updates["{#REPO_ID}"]'
              delay: '0'
              value_type: UNSIGNED
              description: 'Number of available package updates from repository {#REPO_NAME} ({#REPO_ID}).'
              preprocessing:
                - type: JSONPATH
                  parameters:
                    - '$.repositories[?(@.id == "{#REPO_ID}")].update_count.first()'
              master_item:
                key: dnf.get
              tags:
                - tag: component
                  value: updates
                - tag: repository
                  value: '{#REPO_ID}'
                - tag: repository_name
                  value: '{#REPO_NAME}'
            - uuid: 6bd0f599fe084ee698b71920ffa839f9
              name: 'DNF: Repository [{#REPO_NAME}]: Pending package details'
              type: DEPENDENT
              key: 'dnf.repository.update.details["{#REPO_ID}"]'
              delay: '0'
              history: 1d
              value_type: TEXT
              trends: '0'
              description: 'Comma-separated NEVRA identifiers for packages with available updates from repository {#REPO_NAME} ({#REPO_ID}). The value is blank when there are no pending packages.'
              preprocessing:
                - type: JSONPATH
                  parameters:
                    - '$.updates[?(@.repository_id == "{#REPO_ID}")]'
                  error_handler: CUSTOM_VALUE
                  error_handler_params: '[]'
                - type: JAVASCRIPT
                  parameters:
                    - |
                      var updates = JSON.parse(value);
                      var packages = [];

                      for (var i = 0; i < updates.length; i++) {
                        var update = updates[i];
                        var epoch = update.epoch && update.epoch !== '(none)'
                          ? update.epoch + ':'
                          : '';
                        var nevra = update.name + '-' + epoch + update.version
                          + '-' + update.release + '.' + update.arch;

                        if (packages.indexOf(nevra) === -1) {
                          packages.push(nevra);
                        }
                      }

                      return packages.join(', ');
              master_item:
                key: dnf.get
              tags:
                - tag: component
                  value: updates
                - tag: repository
                  value: '{#REPO_ID}'
                - tag: repository_name
                  value: '{#REPO_NAME}'
          master_item:
            key: dnf.get
          preprocessing:
            - type: JSONPATH
              parameters:
                - $.repositories
          lld_macro_paths:
            - lld_macro: '{#REPO_ID}'
              path: $.id
            - lld_macro: '{#REPO_NAME}'
              path: $.name
        - uuid: af3e0c704fbc4d7ba0685d5f08043df8
          name: 'DNF: Advisory discovery'
          type: DEPENDENT
          key: dnf.advisory.discovery
          delay: '0'
          lifetime_type: DELETE_AFTER
          lifetime: 30d
          enabled_lifetime_type: DISABLE_AFTER
          enabled_lifetime: 1d
          description: 'Discovers only advisory severities explicitly enabled by the LLD macros. Lost advisory items remain enabled for one day so the presence value can become zero and recover the trigger, then remain disabled until deletion after 30 days. Invalid macros or incomplete metadata make discovery unsupported rather than returning a false empty list.'
          item_prototypes:
            - uuid: 68a4f86316854fb0be0cb45f043c321b
              name: 'DNF: Advisory [{#ADVISORY_ID}]: Presence'
              type: DEPENDENT
              key: 'dnf.advisory.presence[{#ADVISORY_SAFE_ID}]'
              delay: '0'
              history: 30d
              value_type: UNSIGNED
              trends: '0'
              description: 'Indicates that advisory {#ADVISORY_ID} ({#ADVISORY_TITLE}) remains applicable. The value becomes zero on disappearance before the discovery lifecycle disables the item.'
              valuemap:
                name: 'DNF: No/Yes'
              preprocessing:
                - type: JSONPATH
                  parameters:
                    - '$[?(@.safe_id == "{#ADVISORY_SAFE_ID}")].presence.first()'
                  error_handler: CUSTOM_VALUE
                  error_handler_params: '0'
              master_item:
                key: dnf.advisory.discovery.data
              tags:
                - tag: advisory
                  value: '{#ADVISORY_ID}'
                - tag: component
                  value: security
                - tag: severity
                  value: '{#ADVISORY_SEVERITY}'
            - uuid: 95b5d77dcd3145bf8119f4e734206679
              name: 'DNF: Advisory [{#ADVISORY_ID}]: Vendor timestamp'
              type: DEPENDENT
              key: 'dnf.advisory.vendor.timestamp[{#ADVISORY_SAFE_ID}]'
              delay: '0'
              history: 30d
              value_type: UNSIGNED
              units: unixtime
              trends: '0'
              description: 'Preferred vendor issue timestamp for advisory {#ADVISORY_ID} ({#ADVISORY_TITLE}). Discovery requires complete issue-date metadata.'
              preprocessing:
                - type: JSONPATH
                  parameters:
                    - '$[?(@.safe_id == "{#ADVISORY_SAFE_ID}")].vendor_timestamp.first()'
                  error_handler: DISCARD_VALUE
              master_item:
                key: dnf.advisory.discovery.data
              tags:
                - tag: advisory
                  value: '{#ADVISORY_ID}'
                - tag: component
                  value: security
                - tag: severity
                  value: '{#ADVISORY_SEVERITY}'
            - uuid: 112ae060d33348fea8c8c261d9429bba
              name: 'DNF: Advisory [{#ADVISORY_ID}]: Affected package count'
              type: DEPENDENT
              key: 'dnf.advisory.packages.count[{#ADVISORY_SAFE_ID}]'
              delay: '0'
              history: 30d
              value_type: UNSIGNED
              trends: '0'
              description: 'Number of unique pending package NEVRAs affected by advisory {#ADVISORY_ID}.'
              preprocessing:
                - type: JSONPATH
                  parameters:
                    - '$[?(@.safe_id == "{#ADVISORY_SAFE_ID}")].affected_package_count.first()'
                  error_handler: CUSTOM_VALUE
                  error_handler_params: '0'
              master_item:
                key: dnf.advisory.discovery.data
              tags:
                - tag: advisory
                  value: '{#ADVISORY_ID}'
                - tag: component
                  value: security
                - tag: severity
                  value: '{#ADVISORY_SEVERITY}'
            - uuid: ade0d29ca569497882b08e7a9e050eb9
              name: 'DNF: Advisory [{#ADVISORY_ID}]: Affected package list'
              type: DEPENDENT
              key: 'dnf.advisory.packages.list[{#ADVISORY_SAFE_ID}]'
              delay: '0'
              history: 7d
              value_type: TEXT
              trends: '0'
              description: 'Deterministically sorted JSON array of pending package NEVRAs affected by advisory {#ADVISORY_ID}.'
              preprocessing:
                - type: JSONPATH
                  parameters:
                    - '$[?(@.safe_id == "{#ADVISORY_SAFE_ID}")].affected_packages.first()'
                  error_handler: CUSTOM_VALUE
                  error_handler_params: '[]'
              master_item:
                key: dnf.advisory.discovery.data
              tags:
                - tag: advisory
                  value: '{#ADVISORY_ID}'
                - tag: component
                  value: security
                - tag: severity
                  value: '{#ADVISORY_SEVERITY}'
            - uuid: e06a5f8c7a5a46e582bd18d38534ed30
              name: 'DNF: Advisory [{#ADVISORY_ID}]: CVE list'
              type: DEPENDENT
              key: 'dnf.advisory.cves.list[{#ADVISORY_SAFE_ID}]'
              delay: '0'
              history: 7d
              value_type: TEXT
              trends: '0'
              description: 'Deterministically sorted JSON array of known CVE IDs for advisory {#ADVISORY_ID}. Discovery requires complete CVE metadata.'
              preprocessing:
                - type: JSONPATH
                  parameters:
                    - '$[?(@.safe_id == "{#ADVISORY_SAFE_ID}")].cves.first()'
                  error_handler: CUSTOM_VALUE
                  error_handler_params: '[]'
              master_item:
                key: dnf.advisory.discovery.data
              tags:
                - tag: advisory
                  value: '{#ADVISORY_ID}'
                - tag: component
                  value: security
                - tag: severity
                  value: '{#ADVISORY_SEVERITY}'
          trigger_prototypes:
            - uuid: aa781b59b08d42c594e925b20c0c60ec
              expression: 'last(/DNF by Zabbix agent 2 active/dnf.advisory.presence[{#ADVISORY_SAFE_ID}])=1'
              name: 'DNF: Advisory [{#ADVISORY_ID}] is applicable'
              opdata: 'Severity: {#ADVISORY_SEVERITY}; title: {#ADVISORY_TITLE}'
              priority: HIGH
              description: 'Security advisory {#ADVISORY_ID} applies to one or more pending package updates. Severity is assigned by discovery override.'
              tags:
                - tag: advisory
                  value: '{#ADVISORY_ID}'
                - tag: component
                  value: security
                - tag: scope
                  value: security
                - tag: severity
                  value: '{#ADVISORY_SEVERITY}'
          master_item:
            key: dnf.advisory.discovery.data
          lld_macro_paths:
            - lld_macro: '{#ADVISORY_ID}'
              path: $.id
            - lld_macro: '{#ADVISORY_SAFE_ID}'
              path: $.safe_id
            - lld_macro: '{#ADVISORY_SEVERITY}'
              path: $.severity
            - lld_macro: '{#ADVISORY_TITLE}'
              path: $.title
          overrides:
            - name: 'Critical advisory trigger severity'
              step: '1'
              filter:
                conditions:
                  - macro: '{#ADVISORY_SEVERITY}'
                    value: '^critical$'
              operations:
                - operationobject: TRIGGER_PROTOTYPE
                  operator: REGEXP
                  value: '^DNF: Advisory \['
                  severity: DISASTER
            - name: 'Important advisory trigger severity'
              step: '2'
              filter:
                conditions:
                  - macro: '{#ADVISORY_SEVERITY}'
                    value: '^important$'
              operations:
                - operationobject: TRIGGER_PROTOTYPE
                  operator: REGEXP
                  value: '^DNF: Advisory \['
                  severity: HIGH
            - name: 'Moderate advisory trigger severity'
              step: '3'
              filter:
                conditions:
                  - macro: '{#ADVISORY_SEVERITY}'
                    value: '^moderate$'
              operations:
                - operationobject: TRIGGER_PROTOTYPE
                  operator: REGEXP
                  value: '^DNF: Advisory \['
                  severity: WARNING
            - name: 'Low advisory trigger severity'
              step: '4'
              filter:
                conditions:
                  - macro: '{#ADVISORY_SEVERITY}'
                    value: '^low$'
              operations:
                - operationobject: TRIGGER_PROTOTYPE
                  operator: REGEXP
                  value: '^DNF: Advisory \['
                  severity: INFO
            - name: 'Unknown advisory trigger severity'
              step: '5'
              filter:
                conditions:
                  - macro: '{#ADVISORY_SEVERITY}'
                    value: '^unknown$'
              operations:
                - operationobject: TRIGGER_PROTOTYPE
                  operator: REGEXP
                  value: '^DNF: Advisory \['
                  severity: HIGH
      macros:
        - macro: '{$DNF.ADVISORY.NODATA.TIME}'
          value: 2h
          description: 'Time without a successful advisory collection before an availability problem is raised.'
