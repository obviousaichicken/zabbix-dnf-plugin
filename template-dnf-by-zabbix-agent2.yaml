        - uuid: 2bc44de90ed6439e86e75420536e0210
          name: 'DNF: Advisory details complete'
          type: DEPENDENT
          key: dnf.advisory.details.complete
          value_type: UNSIGNED
          description: 'Indicates whether titles and detail relationships are complete. This is normally false on DNF4 because its bounded strategy omits the bulk detail command.'
          valuemap:
            name: 'DNF: No/Yes'
