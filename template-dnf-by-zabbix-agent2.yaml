        - uuid: d6ebf61e9c2644f78e6e5b2da03ca2c9
          name: 'APT: Update result'
          mappings:
            - value: '0'
              newvalue: 'Not recorded'
            - value: '1'
              newvalue: 'Success'
            - value: '2'
              newvalue: 'Failed'
    - uuid: eb3a823ea3784625ad4ebf81a2e075cb
      template: 'DNF by Zabbix agent 2 active'
      name: 'DNF by Zabbix agent 2 active'
      description: |
        Monitors enabled DNF repositories, available package updates, advisory categories, reboot status, and package update history through the Zabbix DNF Plugin for Agent 2.

        The plugin intentionally fails the master item rather than publishing partial data when repository or advisory classification queries fail. The "other" update category includes packages with missing or unrecognized advisory metadata and does not necessarily mean non-security updates.
      groups:
        - name: 'Templates/Operating systems'
      items:
        - uuid: f57b5a29ead94a4e88a7920a5f9fea4e
          name: 'DNF: Get update data'
          type: ZABBIX_ACTIVE
          key: dnf.get
          delay: '{$DNF.UPDATE.INTERVAL}'
          history: '0'
          value_type: TEXT
          trends: '0'
          description: 'Collects the complete package, repository, advisory, reboot, and update-history payload. The raw JSON is not retained because dependent items extract the monitored values.'
          timeout: 30s
          tags:
            - tag: component
              value: raw
            - tag: component
              value: updates
        - uuid: 9d4539938b634b2fa8c2a8edd8e14cd8
          name: 'DNF: Get advisory data'
          type: ZABBIX_ACTIVE
          key: dnf.advisories.get
          delay: '{$DNF.ADVISORY.UPDATE.INTERVAL}'
          history: '0'
          value_type: TEXT
          trends: '0'
          description: 'Collects applicable DNF security advisories independently from package-update monitoring. DNF4 intentionally returns compact relationship data, while DNF5 can return complete titles, CVEs, and issue dates.'
          timeout: 30s
          tags:
            - tag: component
              value: raw
            - tag: component
              value: security
        - uuid: da4ef166a5714a009543803cb1fb0b5f
          name: 'DNF: Advisory discovery data'
          type: DEPENDENT
          key: dnf.advisory.discovery.data
          history: '0'
          value_type: TEXT
          trends: '0'
          description: 'Validates the complete advisory payload and severity-selection macros, then projects the compact records shared by advisory discovery and its dependent item prototypes. The default macro values produce an empty array. Invalid or incomplete input makes this item unsupported instead of falsely marking discovered advisories absent.'
          preprocessing:
            - type: JAVASCRIPT
              parameters:
                - |
                  var data = JSON.parse(value);
                  var selections = {
                    critical: '{$DNF.ADVISORY.LLD.CRITICAL}',
                    important: '{$DNF.ADVISORY.LLD.IMPORTANT}',
                    moderate: '{$DNF.ADVISORY.LLD.MODERATE}',
                    low: '{$DNF.ADVISORY.LLD.LOW}',
                    unknown: '{$DNF.ADVISORY.LLD.UNKNOWN}'
                  };

                  for (var selectedSeverity in selections) {
                    if (Object.prototype.hasOwnProperty.call(selections, selectedSeverity) &&
                        selections[selectedSeverity] !== '0' && selections[selectedSeverity] !== '1') {
                      throw 'Advisory discovery macro for ' + selectedSeverity + ' must be exactly 0 or 1';
                    }
                  }

                  if (!data || typeof data !== 'object' || Array.isArray(data) || data.schema_version !== 1) {
                    throw 'Advisory discovery requires schema version 1';
                  }
                  if (!data.collection || data.collection.complete !== true) {
                    throw 'Advisory discovery requires a complete collection';
                  }
                  if (!data.metadata || data.metadata.details_complete !== true ||
                      data.metadata.cves_complete !== true || data.metadata.issue_dates_complete !== true) {
                    throw 'Advisory discovery requires complete detail, CVE, and issue-date metadata';
                  }
                  if (!Array.isArray(data.advisories) || !data.summary ||
                      data.summary.advisories !== data.advisories.length) {
                    throw 'Advisory discovery payload count is inconsistent';
                  }

                  function safeIdentifier(id) {
                    if (typeof id !== 'string' || id.length === 0) {
                      throw 'Advisory discovery record has an invalid ID';
                    }
                    if (id.length > 256) {
                      throw 'Advisory discovery ID exceeds 256 UTF-16 code units';
                    }

                    var encoded = 'a';
                    for (var character = 0; character < id.length; character++) {
                      var hex = id.charCodeAt(character).toString(16);
                      while (hex.length < 4) {
                        hex = '0' + hex;
                      }
                      encoded += hex;
                    }
                    return encoded;
                  }

                  function sortedStringArray(values, field, id) {
                    if (!Array.isArray(values)) {
                      throw 'Advisory ' + id + ' has an invalid ' + field + ' array';
                    }

                    var result = [];
                    var seen = {};
                    for (var index = 0; index < values.length; index++) {
                      if (typeof values[index] !== 'string') {
                        throw 'Advisory ' + id + ' has a non-string ' + field + ' value';
                      }
                      var seenKey = '$' + values[index];
                      if (!Object.prototype.hasOwnProperty.call(seen, seenKey)) {
                        seen[seenKey] = true;
                        result.push(values[index]);
                      }
                    }
                    result.sort();
                    return result;
                  }

                  var records = [];
                  var seenIDs = {};
                  var seenSafeIDs = {};
                  for (var advisoryIndex = 0; advisoryIndex < data.advisories.length; advisoryIndex++) {
                    var advisory = data.advisories[advisoryIndex];
                    if (!advisory || typeof advisory !== 'object' || Array.isArray(advisory)) {
                      throw 'Advisory discovery record is not an object';
                    }

                    var id = advisory.id;
                    var safeID = safeIdentifier(id);
                    var seenIDKey = '$' + id;
                    if (Object.prototype.hasOwnProperty.call(seenIDs, seenIDKey) ||
                        Object.prototype.hasOwnProperty.call(seenSafeIDs, safeID)) {
                      throw 'Advisory discovery record has a duplicate ID';
                    }
                    seenIDs[seenIDKey] = true;
                    seenSafeIDs[safeID] = true;

                    var severity = advisory.severity;
                    if (!Object.prototype.hasOwnProperty.call(selections, severity)) {
                      throw 'Advisory ' + id + ' has an invalid severity';
                    }
                    if (advisory.type !== 'security') {
                      throw 'Advisory ' + id + ' is not a security advisory';
                    }
                    if (typeof advisory.title !== 'string' || advisory.title.length === 0) {
                      throw 'Advisory ' + id + ' has an invalid title';
                    }
                    if (typeof advisory.issued_at !== 'string') {
                      throw 'Advisory ' + id + ' has no complete issue timestamp';
                    }

                    var vendorTimestamp = Date.parse(advisory.issued_at);
                    if (isNaN(vendorTimestamp) || vendorTimestamp < 0) {
                      throw 'Advisory ' + id + ' has an invalid issue timestamp';
                    }
                    vendorTimestamp = Math.floor(vendorTimestamp / 1000);

                    var packages = sortedStringArray(
                      advisory.affected_update_nevras,
                      'affected package',
                      id
                    );
                    var cves = sortedStringArray(advisory.cve_ids, 'CVE', id);

                    if (selections[severity] === '1') {
                      records.push({
                        safe_id: safeID,
                        id: id,
                        severity: severity,
                        title: advisory.title,
                        presence: 1,
                        vendor_timestamp: vendorTimestamp,
                        affected_package_count: packages.length,
                        affected_packages: JSON.stringify(packages),
                        cves: JSON.stringify(cves)
                      });
                    }
                  }

                  records.sort(function (left, right) {
                    if (left.safe_id < right.safe_id) {
                      return -1;
                    }
                    if (left.safe_id > right.safe_id) {
                      return 1;
                    }
                    return 0;
                  });
                  return JSON.stringify(records);
          master_item:
            key: dnf.advisories.get
          tags:
            - tag: component
              value: security
        - uuid: 1c5327f4c4f84377840cdf7138053d3f
          name: 'DNF: Advisory collection complete'
          type: DEPENDENT
          key: dnf.advisory.collection.complete
          value_type: UNSIGNED
          description: 'Indicates whether the independent advisory collection completed successfully. Command or parser failures make the master item unsupported and are detected by the no-data condition.'
          valuemap:
            name: 'DNF: No/Yes'
          preprocessing:
            - type: JSONPATH
              parameters:
                - $.collection.complete
            - type: BOOL_TO_DECIMAL
              parameters: []
          master_item:
            key: dnf.advisories.get
          tags:
            - tag: component
              value: security
          triggers:
            - uuid: 2c7047372eb742b59a79ac9fadaa3cec
              expression: 'last(/DNF by Zabbix agent 2 active/dnf.advisory.collection.complete)=0 or nodata(/DNF by Zabbix agent 2 active/dnf.advisory.collection.complete,{$DNF.ADVISORY.NODATA.TIME})=1'
              name: 'DNF: Advisory collection is unavailable'
              opdata: 'Last advisory collection status: {ITEM.LASTVALUE1}'
              priority: HIGH
              description: 'DNF advisory data is stale or unavailable. Package-update monitoring remains independent.'
              tags:
                - tag: component
