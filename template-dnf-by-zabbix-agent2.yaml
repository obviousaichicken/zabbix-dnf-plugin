        - uuid: e0609656a37a41ee85167deaca207f71
          name: 'DNF: Updates pending security'
          type: DEPENDENT
          key: dnf.updates.security
          value_type: UNSIGNED
          description: 'Number of available package updates classified by repository advisory metadata as security updates.'
          preprocessing:
            - type: JAVASCRIPT
              parameters:
                - |
                  var data = JSON.parse(value);
                  if (!data.classification || data.classification.complete !== true) {
                    throw 'Advisory classification is incomplete';
                  }
                  return data.summary.update_types.security;
          master_item:
            key: dnf.get
          tags:
            - tag: component
              value: updates
          triggers:
            - uuid: 4b8f3367f52e437aa7ffbb78f34b19fc
              expression: 'last(/DNF by Zabbix agent 2/dnf.updates.security)>={$DNF.SECURITY.MIN}'
              name: 'DNF: Security updates are available'
              opdata: 'Security updates: {ITEM.LASTVALUE1}'
              priority: HIGH
              description: 'One or more security updates are available.'
              tags:
                - tag: component
                  value: updates
                - tag: scope
                  value: security
        - uuid: dcf7f4a5ef984d3a82999e7c3828453b
          name: 'DNF: Updates pending bugfix'
          type: DEPENDENT
          key: dnf.updates.bugfix
          value_type: UNSIGNED
          description: 'Number of available package updates classified by repository advisory metadata as bug fixes.'
          preprocessing:
            - type: JAVASCRIPT
              parameters:
                - |
                  var data = JSON.parse(value);
                  if (!data.classification || data.classification.complete !== true) {
                    throw 'Advisory classification is incomplete';
                  }
                  return data.summary.update_types.bugfix;
          master_item:
            key: dnf.get
          tags:
            - tag: component
              value: updates
        - uuid: 5909a4d42d6b4997855d8d043b20b093
          name: 'DNF: Updates pending enhancement'
          type: DEPENDENT
          key: dnf.updates.enhancement
          value_type: UNSIGNED
          description: 'Number of available package updates classified by repository advisory metadata as enhancements.'
          preprocessing:
            - type: JAVASCRIPT
              parameters:
                - |
                  var data = JSON.parse(value);
                  if (!data.classification || data.classification.complete !== true) {
                    throw 'Advisory classification is incomplete';
                  }
                  return data.summary.update_types.enhancement;
          master_item:
            key: dnf.get
          tags:
            - tag: component
              value: updates
        - uuid: d7293d7d3c8f4e8681e86977391b2940
          name: 'DNF: Updates pending other'
          type: DEPENDENT
          key: dnf.updates.other
          value_type: UNSIGNED
          description: 'Number of available package updates with no supported advisory category. This can include missing or unrecognized advisory metadata and does not necessarily mean non-security updates.'
          preprocessing:
            - type: JAVASCRIPT
              parameters:
                - |
                  var data = JSON.parse(value);
                  if (!data.classification || data.classification.complete !== true) {
                    throw 'Advisory classification is incomplete';
                  }
                  return data.summary.update_types.other;
          master_item:
            key: dnf.get
          tags:
            - tag: component
              value: updates
        - uuid: 12a81e56d11040f9a7439a7bd4b8c729
          name: 'DNF: Last update result'
          type: DEPENDENT
          key: dnf.last_update.result
          value_type: UNSIGNED
          history: 7d
          trends: '0'
          description: 'Result of the most recent completed DNF transaction that upgraded a package: 0 means not recorded, 1 means success, and 2 means failed.'
          valuemap:
            name: 'DNF: Update result'
          preprocessing:
            - type: JAVASCRIPT
              parameters:
                - |
                  var data = JSON.parse(value);
                  var results = {
                    not_recorded: 0,
                    success: 1,
                    failed: 2
                  };
                  var result = data.summary.last_update.result;

                  if (!Object.prototype.hasOwnProperty.call(results, result)) {
                    throw 'Unsupported last update result: ' + result;
                  }

                  return results[result];
          master_item:
            key: dnf.get
          tags:
            - tag: component
              value: updates
          triggers:
            - uuid: 61c543d10fcd4b91a07b1dfdf51aab15
              expression: 'last(/DNF by Zabbix agent 2/dnf.last_update.result)=2'
              name: 'DNF: Last package update failed'
              opdata: 'Last update result: {ITEM.LASTVALUE1}'
              priority: WARNING
              description: 'The most recent package update transaction did not complete successfully.'
              tags:
                - tag: component
                  value: updates
                - tag: scope
                  value: update_history
        - uuid: 4a8e064bca374014aef4696de773cf6b
          name: 'DNF: Last update time'
          type: DEPENDENT
          key: dnf.last_update.timestamp
          value_type: UNSIGNED
          units: unixtime
          trends: '0'
          description: 'Unix timestamp of the most recent completed DNF transaction that upgraded a package. No value is stored when no such transaction exists.'
          preprocessing:
            - type: JAVASCRIPT
              parameters:
                - |
                  var data = JSON.parse(value);
                  if (data.summary.last_update.timestamp === null) {
                    return null;
                  }

                  var timestamp = Date.parse(data.summary.last_update.timestamp);
                  if (isNaN(timestamp)) {
                    throw 'Invalid last update timestamp';
                  }

                  return Math.floor(timestamp / 1000);
          master_item:
            key: dnf.get
          tags:
            - tag: component
              value: updates
      discovery_rules:
        - uuid: 7f462a6012114cfd95e1e18768942f05
          name: 'DNF: Repository discovery'
          type: DEPENDENT
          key: dnf.repository
          delay: '0'
          lifetime_type: DELETE_AFTER
          lifetime: 30d
          enabled_lifetime_type: DISABLE_IMMEDIATELY
          enabled_lifetime: '0'
          description: 'Discovers enabled DNF repositories. Items for repositories that disappear are disabled immediately and retained for 30 days before deletion.'
          item_prototypes:
            - uuid: a4768ffdaf7e4228abd8aaccc5bb726c
              name: 'DNF: Repository [{#REPO_NAME}]: Available update count'
              type: DEPENDENT
              key: 'dnf.repository.updates["{#REPO_ID}"]'
              delay: '0'
              value_type: UNSIGNED
              description: 'Number of available package updates from repository {#REPO_NAME} ({#REPO_ID}).'
              preprocessing:
                - type: JSONPATH
                  parameters:
                    - '$.repositories[?(@.id == "{#REPO_ID}")].update_count.first()'
              master_item:
                key: dnf.get
              tags:
                - tag: component
                  value: updates
                - tag: repository
                  value: '{#REPO_ID}'
                - tag: repository_name
                  value: '{#REPO_NAME}'
            - uuid: 670f6c170822419692948b5d4e500e40
              name: 'DNF: Repository [{#REPO_NAME}]: Pending package details'
              type: DEPENDENT
              key: 'dnf.repository.update.details["{#REPO_ID}"]'
              delay: '0'
              history: 1d
              value_type: TEXT
              trends: '0'
              description: 'Comma-separated NEVRA identifiers for packages with available updates from repository {#REPO_NAME} ({#REPO_ID}). The value is blank when there are no pending packages.'
              preprocessing:
                - type: JSONPATH
                  parameters:
                    - '$.updates[?(@.repository_id == "{#REPO_ID}")]'
                  error_handler: CUSTOM_VALUE
                  error_handler_params: '[]'
                - type: JAVASCRIPT
                  parameters:
                    - |
                      var updates = JSON.parse(value);
                      var packages = [];

                      for (var i = 0; i < updates.length; i++) {
                        var update = updates[i];
                        var epoch = update.epoch && update.epoch !== '(none)'
                          ? update.epoch + ':'
                          : '';
                        var nevra = update.name + '-' + epoch + update.version
                          + '-' + update.release + '.' + update.arch;

                        if (packages.indexOf(nevra) === -1) {
                          packages.push(nevra);
                        }
                      }

                      return packages.join(', ');
              master_item:
                key: dnf.get
              tags:
                - tag: component
                  value: updates
                - tag: repository
                  value: '{#REPO_ID}'
                - tag: repository_name
                  value: '{#REPO_NAME}'
          master_item:
            key: dnf.get
          preprocessing:
            - type: JSONPATH
              parameters:
                - $.repositories
          lld_macro_paths:
            - lld_macro: '{#REPO_ID}'
              path: $.id
            - lld_macro: '{#REPO_NAME}'
              path: $.name
        - uuid: dd7f6b9ba90f483f9f8d0943b7ce6ee9
          name: 'DNF: Advisory discovery'
          type: DEPENDENT
          key: dnf.advisory.discovery
          delay: '0'
          lifetime_type: DELETE_AFTER
          lifetime: 30d
          enabled_lifetime_type: DISABLE_AFTER
          enabled_lifetime: 1d
          description: 'Discovers only advisory severities explicitly enabled by the LLD macros. Lost advisory items remain enabled for one day so the presence value can become zero and recover the trigger, then remain disabled until deletion after 30 days. Invalid macros or incomplete metadata make discovery unsupported rather than returning a false empty list.'
          item_prototypes:
            - uuid: 3aa7af243dfc48088a9e893ecd2c08b6
              name: 'DNF: Advisory [{#ADVISORY_ID}]: Presence'
              type: DEPENDENT
              key: 'dnf.advisory.presence[{#ADVISORY_SAFE_ID}]'
              delay: '0'
              history: 30d
              value_type: UNSIGNED
              trends: '0'
              description: 'Indicates that advisory {#ADVISORY_ID} ({#ADVISORY_TITLE}) remains applicable. The value becomes zero on disappearance before the discovery lifecycle disables the item.'
              valuemap:
                name: 'DNF: No/Yes'
              preprocessing:
                - type: JSONPATH
                  parameters:
                    - '$[?(@.safe_id == "{#ADVISORY_SAFE_ID}")].presence.first()'
                  error_handler: CUSTOM_VALUE
                  error_handler_params: '0'
              master_item:
                key: dnf.advisory.discovery.data
              tags:
                - tag: advisory
                  value: '{#ADVISORY_ID}'
                - tag: component
                  value: security
                - tag: severity
                  value: '{#ADVISORY_SEVERITY}'
            - uuid: f61e32368a0744149953a5f697bbd37e
              name: 'DNF: Advisory [{#ADVISORY_ID}]: Vendor timestamp'
              type: DEPENDENT
              key: 'dnf.advisory.vendor.timestamp[{#ADVISORY_SAFE_ID}]'
              delay: '0'
              history: 30d
              value_type: UNSIGNED
              units: unixtime
              trends: '0'
              description: 'Preferred vendor issue timestamp for advisory {#ADVISORY_ID} ({#ADVISORY_TITLE}). Discovery requires complete issue-date metadata.'
              preprocessing:
                - type: JSONPATH
                  parameters:
                    - '$[?(@.safe_id == "{#ADVISORY_SAFE_ID}")].vendor_timestamp.first()'
                  error_handler: DISCARD_VALUE
              master_item:
                key: dnf.advisory.discovery.data
              tags:
                - tag: advisory
                  value: '{#ADVISORY_ID}'
                - tag: component
                  value: security
                - tag: severity
                  value: '{#ADVISORY_SEVERITY}'
            - uuid: d053aac1f63b4aacacf70626ea3916ff
              name: 'DNF: Advisory [{#ADVISORY_ID}]: Affected package count'
              type: DEPENDENT
              key: 'dnf.advisory.packages.count[{#ADVISORY_SAFE_ID}]'
              delay: '0'
              history: 30d
              value_type: UNSIGNED
              trends: '0'
              description: 'Number of unique pending package NEVRAs affected by advisory {#ADVISORY_ID}.'
              preprocessing:
                - type: JSONPATH
                  parameters:
                    - '$[?(@.safe_id == "{#ADVISORY_SAFE_ID}")].affected_package_count.first()'
                  error_handler: CUSTOM_VALUE
                  error_handler_params: '0'
              master_item:
                key: dnf.advisory.discovery.data
              tags:
                - tag: advisory
                  value: '{#ADVISORY_ID}'
                - tag: component
                  value: security
                - tag: severity
                  value: '{#ADVISORY_SEVERITY}'
            - uuid: 219f186890ec474aa58a1dce2c74d01a
              name: 'DNF: Advisory [{#ADVISORY_ID}]: Affected package list'
              type: DEPENDENT
              key: 'dnf.advisory.packages.list[{#ADVISORY_SAFE_ID}]'
              delay: '0'
              history: 7d
              value_type: TEXT
              trends: '0'
              description: 'Deterministically sorted JSON array of pending package NEVRAs affected by advisory {#ADVISORY_ID}.'
              preprocessing:
                - type: JSONPATH
                  parameters:
                    - '$[?(@.safe_id == "{#ADVISORY_SAFE_ID}")].affected_packages.first()'
                  error_handler: CUSTOM_VALUE
                  error_handler_params: '[]'
              master_item:
                key: dnf.advisory.discovery.data
              tags:
                - tag: advisory
                  value: '{#ADVISORY_ID}'
                - tag: component
                  value: security
                - tag: severity
                  value: '{#ADVISORY_SEVERITY}'
            - uuid: 78afb14f834a40e8ad5810e58d2707a3
              name: 'DNF: Advisory [{#ADVISORY_ID}]: CVE list'
              type: DEPENDENT
              key: 'dnf.advisory.cves.list[{#ADVISORY_SAFE_ID}]'
              delay: '0'
              history: 7d
              value_type: TEXT
              trends: '0'
              description: 'Deterministically sorted JSON array of known CVE IDs for advisory {#ADVISORY_ID}. Discovery requires complete CVE metadata.'
              preprocessing:
                - type: JSONPATH
                  parameters:
                    - '$[?(@.safe_id == "{#ADVISORY_SAFE_ID}")].cves.first()'
                  error_handler: CUSTOM_VALUE
                  error_handler_params: '[]'
              master_item:
                key: dnf.advisory.discovery.data
              tags:
                - tag: advisory
                  value: '{#ADVISORY_ID}'
                - tag: component
                  value: security
                - tag: severity
                  value: '{#ADVISORY_SEVERITY}'
          trigger_prototypes:
            - uuid: ef39db821a6e44158a67b9f3e220c456
              expression: 'last(/DNF by Zabbix agent 2/dnf.advisory.presence[{#ADVISORY_SAFE_ID}])=1'
              name: 'DNF: Advisory [{#ADVISORY_ID}] is applicable'
              opdata: 'Severity: {#ADVISORY_SEVERITY}; title: {#ADVISORY_TITLE}'
              priority: HIGH
              description: 'Security advisory {#ADVISORY_ID} applies to one or more pending package updates. Severity is assigned by discovery override.'
              tags:
                - tag: advisory
                  value: '{#ADVISORY_ID}'
                - tag: component
                  value: security
                - tag: scope
                  value: security
                - tag: severity
                  value: '{#ADVISORY_SEVERITY}'
          master_item:
            key: dnf.advisory.discovery.data
          lld_macro_paths:
            - lld_macro: '{#ADVISORY_ID}'
              path: $.id
            - lld_macro: '{#ADVISORY_SAFE_ID}'
              path: $.safe_id
            - lld_macro: '{#ADVISORY_SEVERITY}'
              path: $.severity
            - lld_macro: '{#ADVISORY_TITLE}'
              path: $.title
          overrides:
            - name: 'Critical advisory trigger severity'
              step: '1'
              filter:
                conditions:
                  - macro: '{#ADVISORY_SEVERITY}'
                    value: '^critical$'
              operations:
                - operationobject: TRIGGER_PROTOTYPE
                  operator: REGEXP
                  value: '^DNF: Advisory \['
                  severity: DISASTER
            - name: 'Important advisory trigger severity'
              step: '2'
              filter:
                conditions:
                  - macro: '{#ADVISORY_SEVERITY}'
                    value: '^important$'
              operations:
                - operationobject: TRIGGER_PROTOTYPE
                  operator: REGEXP
                  value: '^DNF: Advisory \['
                  severity: HIGH
            - name: 'Moderate advisory trigger severity'
              step: '3'
              filter:
                conditions:
                  - macro: '{#ADVISORY_SEVERITY}'
                    value: '^moderate$'
              operations:
                - operationobject: TRIGGER_PROTOTYPE
                  operator: REGEXP
                  value: '^DNF: Advisory \['
                  severity: WARNING
            - name: 'Low advisory trigger severity'
              step: '4'
              filter:
                conditions:
                  - macro: '{#ADVISORY_SEVERITY}'
                    value: '^low$'
              operations:
                - operationobject: TRIGGER_PROTOTYPE
                  operator: REGEXP
                  value: '^DNF: Advisory \['
                  severity: INFO
            - name: 'Unknown advisory trigger severity'
              step: '5'
              filter:
                conditions:
                  - macro: '{#ADVISORY_SEVERITY}'
                    value: '^unknown$'
              operations:
                - operationobject: TRIGGER_PROTOTYPE
                  operator: REGEXP
                  value: '^DNF: Advisory \['
                  severity: HIGH
      macros:
        - macro: '{$DNF.ADVISORY.NODATA.TIME}'
          value: 2h
          description: 'Time without a successful advisory collection before an availability problem is raised.'
        - macro: '{$DNF.ADVISORY.LLD.CRITICAL}'
          value: '0'
          description: 'Set to exactly 1 to discover per-advisory items and triggers for Critical advisories; 0 keeps this severity disabled.'
        - macro: '{$DNF.ADVISORY.LLD.IMPORTANT}'
          value: '0'
          description: 'Set to exactly 1 to discover per-advisory items and triggers for Important advisories; 0 keeps this severity disabled.'
        - macro: '{$DNF.ADVISORY.LLD.LOW}'
          value: '0'
          description: 'Set to exactly 1 to discover per-advisory items and triggers for Low advisories; 0 keeps this severity disabled.'
        - macro: '{$DNF.ADVISORY.LLD.MODERATE}'
          value: '0'
          description: 'Set to exactly 1 to discover per-advisory items and triggers for Moderate advisories; 0 keeps this severity disabled.'
        - macro: '{$DNF.ADVISORY.LLD.UNKNOWN}'
          value: '0'
          description: 'Set to exactly 1 to discover per-advisory items and triggers for Unknown-severity advisories; 0 keeps this severity disabled.'
        - macro: '{$DNF.ADVISORY.UPDATE.INTERVAL}'
          value: 1h
          description: 'Interval between independent DNF advisory collections.'
        - macro: '{$DNF.COLLECTION.DURATION.MAX}'
          value: '20'
          description: 'Maximum acceptable average collection duration, in seconds.'
        - macro: '{$DNF.COLLECTION.DURATION.WINDOW}'
          value: 30m
          description: 'Evaluation window for the average collection duration.'
        - macro: '{$DNF.NODATA.TIME}'
          value: 30m
          description: 'Time without a successful collection before an availability problem is raised.'
        - macro: '{$DNF.SECURITY.MIN}'
          value: '1'
          description: 'Minimum number of security updates that raises a problem.'
        - macro: '{$DNF.SECURITY.ADVISORY.MAX.AGE}'
          value: 7d
          description: 'Maximum acceptable age of the oldest known vendor timestamp for an applicable advisory.'
        - macro: '{$DNF.SECURITY.CRITICAL.MIN}'
          value: '1'
          description: 'Minimum number of Critical advisories that raises a Disaster problem.'
        - macro: '{$DNF.SECURITY.IMPORTANT.MIN}'
          value: '1'
          description: 'Minimum number of Important advisories that raises a High problem when no Critical threshold is met.'
        - macro: '{$DNF.SECURITY.UNKNOWN.MAX}'
          value: '0'
          description: 'Maximum accepted number of advisories or affected package updates with Unknown severity.'
        - macro: '{$DNF.UPDATE.INTERVAL}'
          value: 15m
          description: 'Interval between complete DNF collections.'
      valuemaps:
        - uuid: 62a14312cd71491cab29b01d120c7cd4
          name: 'DNF: No/Yes'
          mappings:
            - value: '0'
              newvalue: 'No'
            - value: '1'
              newvalue: 'Yes'
        - uuid: 9feda965a52f4e8daf26c1392597e48f
          name: 'DNF: Update result'
          mappings:
            - value: '0'
              newvalue: 'Not recorded'
            - value: '1'
              newvalue: 'Success'
            - value: '2'
              newvalue: 'Failed'
    - uuid: c0ad58635b144642908149b5a986410c
      template: 'APT by Zabbix agent 2'
      name: 'APT by Zabbix agent 2'
      description: |
        Monitors configured APT repositories, available package updates, security classification, cached-index age, reboot status, and package update history through the Zabbix DNF Plugin for Agent 2.

        The plugin reads existing local APT indexes and never refreshes them. The "other" category means an update was not positively identified as official security; it is not proof that the update has no security impact.
      groups:
        - name: 'Templates/Operating systems'
      items:
        - uuid: 23281288c64c4f839e489a0a183c49d7
          name: 'APT: Get update data'
          type: ZABBIX_PASSIVE
          key: packages.get
          delay: '{$APT.UPDATE.INTERVAL}'
          history: '0'
          value_type: TEXT
          trends: '0'
          description: 'Collects the complete package, repository, security-classification, cached-index, reboot, and update-history payload. The plugin reads existing APT metadata and does not refresh it. The raw JSON is not retained because dependent items extract the monitored values.'
          timeout: 30s
          tags:
            - tag: component
              value: raw
            - tag: component
              value: updates
        - uuid: 99fdfc918cfa49ffa97fa0e79135f542
          name: 'APT: Collection complete'
          type: DEPENDENT
          key: apt.collection.complete
          value_type: UNSIGNED
          description: 'Indicates whether the plugin completed every required APT and dpkg query. Failed collections make the master item unsupported and are also detected by the no-data condition.'
          valuemap:
            name: 'APT: No/Yes'
          preprocessing:
            - type: JSONPATH
              parameters:
                - $.collection.complete
            - type: BOOL_TO_DECIMAL
              parameters: []
          master_item:
            key: packages.get
          tags:
            - tag: component
